name: Deploy ThaiFood AI to Hugging Face Space

on:
  push:
    branches: [thaifood-space-deploy]
    paths:
      - 'thaifood_space/**'
      - '.github/workflows/thaifood-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: thaifood-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish app.py to existing ThaiFood AI Space
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Hugging Face CLI with Trusted Publisher support
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=1.19,<2'

      # Re-check Hugging Face trusted publisher after repository/ref correction
      - name: Diagnose trusted publisher identity (safe claims only)
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL', '')
          token = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN', '')
          if not url or not token:
              raise SystemExit('GitHub OIDC request environment missing: check id-token: write')
          sep = '&' if '?' in url else '?'
          req = urllib.request.Request(url + sep + 'audience=https%3A%2F%2Fhuggingface.co', headers={'Authorization': 'Bearer ' + token})
          with urllib.request.urlopen(req, timeout=20) as response:
              jwt = json.load(response)['value']
          payload = jwt.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + '=' * (-len(payload) % 4)))
          for field in ('repository','ref','workflow','workflow_ref','event_name','aud'):
              print(f"OIDC {field}: {claims.get(field, '(none)')}")
          print('OIDC token itself is never printed or stored.')
          PY

      - name: Validate code and nutrition data before publish
        run: python thaifood_space/test_assets.py

      - name: Test image-to-chat multi-turn interactions
        run: python thaifood_space/test_flow.py

      - name: Upload validated source and data to existing Space using OIDC
        env:
          HF_OIDC_RESOURCE: spaces/NONGAME/ThaiFood-AI-Gradio
        run: |
          hf upload NONGAME/ThaiFood-AI-Gradio thaifood_space . --repo-type space \
            --include 'app.py' --include 'knowledge.py' --include 'nutrition_50.csv' \
            --include 'evaluation.json' --include 'pdf_sources.json' \
            --include 'requirements.txt' --include 'README.md' \
            --commit-message "Sync validated ThaiFood AI source and data from GitHub"

      - name: Post-deploy live Gradio HTTP and component check
        continue-on-error: true
        run: python thaifood_space/test_live.py

      - name: Summary
        run: |
          echo "Published validated ThaiFood AI source and data to existing Space; pretrained checkpoint was preserved." >> "$GITHUB_STEP_SUMMARY"
