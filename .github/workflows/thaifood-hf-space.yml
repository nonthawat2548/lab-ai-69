name: Deploy ThaiFood AI to Hugging Face Space

on:
  push:
    branches: [thaifood-space-deploy]
    paths:
      - 'thaifood_space/**'
      - '.github/workflows/thaifood-hf-space.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thaifood-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Update existing NONGAME/ThaiFood-AI-Gradio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.28,<2'
      - name: Upload only app.py (keep existing checkpoint and all datasets)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi
          token = os.getenv("HF_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing repository secret HF_TOKEN. Add a fine-grained Hugging Face token with write access to NONGAME/ThaiFood-AI-Gradio.")
          source = Path("thaifood_space/app.py")
          assert source.is_file(), "Missing app.py in GitHub branch"
          api = HfApi(token=token)
          commit = api.upload_file(
              path_or_fileobj=str(source),
              path_in_repo="app.py",
              repo_id="NONGAME/ThaiFood-AI-Gradio",
              repo_type="space",
              commit_message="Deploy reviewed ThaiFood AI simple UI and chat fixes",
          )
          print("Pushed app.py to existing Hugging Face Space")
          print(commit)
          PY
